<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Tobby</title>
<style>
  :root {
    --ink: #16324f;
    --paper: #f4f6f1;
    --card: #ffffff;
    --line: #dde3d8;
    --leaf: #2f9e6e;
    --text: #1b2733;
    --muted: #66758a;
    --code-bg: #14202e;
    --code-fg: #e7edf5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #0f1f31;
      --paper: #0c1620;
      --card: #16222f;
      --line: #25384a;
      --leaf: #4cc38f;
      --text: #e6edf4;
      --muted: #8da0b5;
      --code-bg: #08111a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }
  header {
    background: var(--ink); color: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
  }
  header img { width: 38px; height: 38px; border-radius: 10px; }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 700; }
  header p { margin: 0; font-size: .78rem; opacity: .75; }
  header button {
    margin-left: auto; background: transparent; color: #fff;
    border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
    padding: 6px 14px; font: inherit; font-size: .85rem; cursor: pointer;
  }
  #log {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  .msg {
    max-width: 88%; padding: 10px 14px; border-radius: 16px;
    overflow-wrap: anywhere; line-height: 1.55;
  }
  .msg.bot { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; align-self: flex-start; }
  .msg.user { background: var(--ink); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; white-space: pre-wrap; }
  .msg.err { border-color: #c0504d; color: #c0504d; }
  .msg pre {
    background: var(--code-bg); color: var(--code-fg);
    padding: 10px 12px; border-radius: 10px; overflow-x: auto; font-size: .85rem; margin: 8px 0;
  }
  .msg code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
  .msg :not(pre) > code { background: rgba(127,140,160,.18); padding: 1px 5px; border-radius: 5px; }
  .msg p { margin: 0 0 .6em; } .msg p:last-child { margin-bottom: 0; }
  .typing { display: inline-flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: b 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%,60%,100% { opacity: .3 } 30% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
  form {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--card); border-top: 1px solid var(--line);
  }
  .bar { display: flex; gap: 8px; align-items: flex-end; max-width: 760px; width: 100%; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; max-height: 140px;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--paper); color: var(--text);
    padding: 10px 14px; font: inherit;
  }
  textarea:focus, button:focus-visible { outline: 2px solid var(--leaf); outline-offset: 1px; }
  #send {
    background: var(--leaf); color: #fff; border: 0; border-radius: 14px;
    padding: 0 18px; height: 44px; font: inherit; font-weight: 700; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <img src="/icon-192.png" alt="">
  <div><h1>Tobby</h1><p>Tu asistente de Python</p></div>
  <button id="new" type="button">Nueva charla</button>
</header>

<main id="log" aria-live="polite"></main>

<form id="form">
  <div class="bar">
    <textarea id="input" rows="1" placeholder="Escribe tu mensaje" aria-label="Mensaje"></textarea>
    <button id="send" type="submit">Enviar</button>
  </div>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

let conversationId = "";
let userId = "";
try {
  conversationId = localStorage.getItem("tobby_conv") || "";
  userId = localStorage.getItem("tobby_user") || "";
  if (!userId) {
    userId = "u-" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("tobby_user", userId);
  }
} catch { userId = userId || "u-anon"; }

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Markdown mínimo: bloques de código, `código`, **negrita**, párrafos.
function render(text) {
  const parts = text.split(/```/);
  return parts.map((chunk, i) => {
    if (i % 2 === 1) {
      const code = chunk.replace(/^[a-zA-Z0-9_+-]*\n/, "");
      return "<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>";
    }
    return esc(chunk)
      .split(/\n{2,}/)
      .filter((p) => p.trim())
      .map((p) =>
        "<p>" +
        p.replace(/`([^`]+)`/g, "<code>$1</code>")
         .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
         .replace(/\n/g, "<br>") +
        "</p>"
      ).join("");
  }).join("");
}

function addMsg(role, html, isHtml) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  if (isHtml) el.innerHTML = html; else el.textContent = html;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function greet() {
  addMsg("bot", render("¡Hola! Soy Tobby. Cuéntame qué vamos a crear hoy en Python."), true);
}
greet();

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

document.getElementById("new").addEventListener("click", () => {
  conversationId = "";
  try { localStorage.removeItem("tobby_conv"); } catch {}
  log.innerHTML = "";
  greet();
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = input.value.trim();
  if (!query) return;
  input.value = ""; input.style.height = "auto";
  sendBtn.disabled = true;

  addMsg("user", query);
  const bot = addMsg("bot", '<span class="typing"><i></i><i></i><i></i></span>', true);
  let answer = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, conversation_id: conversationId, user: userId }),
    });
    if (!res.ok) {
      let msg = "No pude conectar con Tobby.";
      try { const j = await res.json(); msg = j.error + (j.detail ? " — " + j.detail : ""); } catch {}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (ev.conversation_id && ev.conversation_id !== conversationId) {
          conversationId = ev.conversation_id;
          try { localStorage.setItem("tobby_conv", conversationId); } catch {}
        }
        if (ev.event === "message" || ev.event === "agent_message") {
          answer += ev.answer || "";
          bot.innerHTML = render(answer);
          log.scrollTop = log.scrollHeight;
        } else if (ev.event === "error") {
          throw new Error(ev.message || "Error en el agente.");
        }
      }
    }
    if (!answer) bot.textContent = "Tobby no devolvió respuesta. Intenta de nuevo.";
  } catch (err) {
    bot.classList.add("err");
    bot.textContent = err.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
